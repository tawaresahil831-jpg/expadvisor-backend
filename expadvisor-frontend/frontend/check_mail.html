<body class="bg-background font-body-md text-on-background">

    <main class="min-h-screen flex items-center justify-center p-margin-mobile">
        <div class="flex flex-col w-full h-full items-center justify-center py-24 relative overflow-hidden bg-background">

            <!-- Ambient Background Elements -->
            <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-3xl mix-blend-multiply pointer-events-none transform -translate-x-1/2 -translate-y-1/2"></div>

            <!-- Success Card -->
            <div class="relative z-10 w-full max-w-md mx-auto p-8 md:p-12 bg-white/80 backdrop-blur-xl rounded-[24px] shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-white/50 flex flex-col items-center text-center transform transition-all duration-500 ease-out translate-y-0 opacity-100" id="success-card">

                    <div class="absolute inset-2 bg-primary/20 rounded-full animate-pulse"></div>

                        <circle cx="15" cy="15" r="2"></circle>
                        <circle cx="85" cy="20" r="1.5"></circle>
                        <circle cx="80" cy="80" r="2.5"></circle>
                        <circle cx="20" cy="85" r="1"></circle>

                        <span class="relative z-10 flex items-center gap-2">

                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                    </a>

                        <p class="font-body-md text-body-md text-on-surface-variant text-sm">

                        </p>

                        </button>
                    </div>

            </div>

    <script>
        // Entrance Animation
        document.addEventListener('DOMContentLoaded', function() {
            var card = document.getElementById('success-card');
            if (card) {
                // Initial state: slightly lower and transparent
                card.style.transform = 'translateY(20px)';
                card.style.opacity = '0';

                // Trigger animation on next frame
                requestAnimationFrame(function() {
                    card.style.transform = 'translateY(0)';
                    card.style.opacity = '1';
                });
            }
        });
    </script>
