<body class="bg-background font-body-md text-on-surface">
<main class="relative min-h-screen">
  <div class="flex flex-col w-full h-full min-h-screen lg:flex-row">

    <!-- Left Column: Branding/Image -->
    <div class="hidden lg:flex flex-col flex-1 bg-surface-container relative overflow-hidden p-margin-desktop">
      <div class="absolute inset-0 bg-cover bg-center"
           style="background-image: url('https://kommodo.ai/i/8bxfvqF34mqs6b3WwSLQ'); filter: hue-rotate(20deg);">
      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-primary/20"></div>
      
      <!-- Logo -->
      <div class="relative z-10 flex items-center gap-3 mb-auto">
          <img class="h-8 w-auto object-contain brightness-0 invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCejsZEw_6KhdC2p5NH-lGPJ22OgddUXOP-B9Id48bT_js4NtBCOQ7C15IzNxK6tQgO88OtzrpVPDta_4yjNr_0uM6xXyiHD-Pd3_pfpTuhUrmvnuvUXhShbS-8JSOm9EuinnPJf74T35D_8UsOUkvD3lQzOpfPbNYdOJfpE9iG_fu0T69FofVkzSet1WIOCVG62xykoffpL_FUA5qAp9gNs66MHeBgPhrKl-TjMrP9lUad_PRgq2RSRfgeTlVfiAIPS73ZTvEGyBhmsxc" alt="Logo">
          <span class="text-headline-md font-headline-md text-on-primary">EXPadviser</span>
      </div>

      <div class="relative z-10 mt-auto text-on-primary max-w-lg">
        <h1 class="font-display-lg text-display-lg mb-gutter">Create new password.</h1>
        <p class="font-body-lg text-body-lg text-on-primary/90">Make it strong and memorable.</p>
      </div>
    </div>

    <!-- Right Column: Form -->
    <div class="flex flex-col flex-1 bg-surface justify-center px-margin-mobile lg:px-margin-desktop py-margin-desktop relative">

      <div class="w-full max-w-md mx-auto mt-12 lg:mt-0">
        <!-- Header -->
        <div class="mb-8 text-center lg:text-left">
          <div class="w-12 h-12 bg-secondary/10 rounded-xl flex items-center justify-center mb-6 mx-auto lg:mx-0 text-secondary">
              <span class="material-symbols-outlined text-[28px]">key</span>
          </div>
          <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Reset Password</h2>
          <p class="font-body-md text-body-md text-on-surface-variant">Enter your new password below.</p>
        </div>

        <div id="statusMessage" class="font-label-md hidden mb-6 p-4 rounded-lg"></div>

        <!-- Form -->
        <form id="resetForm" class="space-y-6 w-full">
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-label-md text-on-surface" for="inputpassword">New Password</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/60 text-[20px]">lock</span>
                <input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-12 pr-12 py-3.5 rounded-xl border border-outline-variant/30 focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all"
                       id="inputpassword" placeholder="••••••••" required type="password" minlength="6">
                <button id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button" style="color:#45474c;">
                  <span class="material-symbols-outlined text-[20px]">visibility</span>
                </button>
            </div>
          </div>

          <button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3.5 rounded-xl shadow-md hover:bg-secondary-container hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2" type="submit">
            <span>Update Password</span>
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
          </button>
        </form>

      </div>
    </div>

  </div>
</main>

<script src="js/api.js"></script>
<script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.textContent = 'Invalid or missing reset token. Please request a new link.';
        statusMsg.className = 'font-label-md mb-6 p-4 rounded-lg bg-error-container text-on-error-container border border-error/30 text-center block';
        document.getElementById('resetForm').style.display = 'none';
    }

    // Toggle password visibility
    const passwordInput = document.getElementById('inputpassword');
    const togglePasswordBtn = document.getElementById('togglePassword');
    if (passwordInput && togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">visibility_off</span>`;
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">visibility</span>`;
            }
        });
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        const btn = e.target.querySelector('button[type="submit"]');
        const statusMsg = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerHTML = `<span>Updating...</span><span class="material-symbols-outlined text-[18px] animate-spin">refresh</span>`;
        
        const response = await apiRequest('/auth/reset-password', {
            method: 'POST',
            body: { token, password }
        });
        
        if (response.status === 200) {
            statusMsg.textContent = 'Password reset successful! Redirecting to login...';
            statusMsg.className = 'font-label-md mb-6 p-4 rounded-lg bg-surface-container-high text-on-surface border border-outline-variant/30 text-center block';
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        } else {
            statusMsg.textContent = response.data ? response.data.message : 'Error resetting password';
            statusMsg.className = 'font-label-md mb-6 p-4 rounded-lg bg-error-container text-on-error-container border border-error/30 text-center block';
            btn.disabled = false;
            btn.innerHTML = `<span>Update Password</span><span class="material-symbols-outlined text-[18px]">check_circle</span>`;
        }
    });
</script>
</body>
</html>
