<main class="relative min-h-[1024px]">

      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"></div>
      <div class="relative z-10 mt-auto text-on-primary max-w-lg">
        <h1 class="font-display-lg text-display-lg mb-gutter">Connect. Ask. Learn. Grow.</h1>

        </div>

        <form id="loginForm" class="space-y-gutter w-full">

                   id="email" placeholder="student@university.edu" required type="email">
          </div>

          <div class="flex flex-col gap-base">
            <div class="flex justify-between items-center">
              <label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
              <a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="forgot_pass.html">Forgot Password?</a>
            </div>
            <div class="relative">

                     id="password" placeholder="••••••••" required type="password">
              <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center">

<script src="js/api.js?v=2"></script>
<script>
  if (getToken()) window.location.href = 'dashboard.html';

  async function handleCredentialResponse(googleResponse) {
    const errorMsg = document.getElementById('errorMsg');
    
    const response = await apiRequest('/auth/google', {
      method: 'POST',
      body: { token: googleResponse.credential }
    });
    
    if (response.status === 200 || response.status === 201) {
      setToken(response.data.data.token);
      window.location.href = 'dashboard.html';
    } else {
      errorMsg.textContent = 'Google Sign In failed: ' + (response.data && response.data.message ? response.data.message : 'Unknown error');
      errorMsg.classList.remove('hidden');
    }
  }

  window.onload = function () {
    google.accounts.id.initialize({
      client_id: "264177546521-l4f6okrlas9sk890h9elaj17ce6ok5h7.apps.googleusercontent.com",
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById("googleBtnContainer"),
      { theme: "outline", size: "large", width: 280 }
    );
  };


  
  const toggleBtn = document.getElementById('togglePasswordBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const pwdInput = document.getElementById('password');
      const pwdIcon = document.getElementById('togglePasswordIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.textContent = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        pwdIcon.textContent = 'visibility';
      }
    });
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    
    errorMsg.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>Signing In...</span>`;
    
    const response = await apiRequest('/auth/login', {
      method: 'POST',
      body: { email, password }
    });
    
    if (response.status === 200 && response.data.success) {
      setToken(response.data.data.token);
      window.location.href = 'dashboard.html';
    } else {
      errorMsg.textContent = response.data.message || 'Login failed. Please try again.';
      errorMsg.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Sign In</span>`;
    }
  });
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  function handleGoogleLogin(response) {
    const errorMsg = document.getElementById('errorMessage');
    if(errorMsg) errorMsg.classList.add('hidden');
    
    apiRequest('/auth/google', {
        method: 'POST',
        body: { credential: response.credential }
    }).then(res => {
        if (res.status === 200 || res.status === 201) {
            setToken(res.data.data.token);
            window.location.href = 'dashboard.html';
        } else {
            if(errorMsg) {
                errorMsg.textContent = 'Google Sign In failed: ' + (res.data ? res.data.message : 'Unknown error');
                errorMsg.classList.remove('hidden');
            } else {
                alert('Google Sign In failed');
            }
        }
    }).catch(err => {
        console.error(err);
        if(errorMsg) {
            errorMsg.textContent = 'Network error during Google Sign In';
            errorMsg.classList.remove('hidden');
        }
    });
  }

  window.addEventListener('load', function () {
    google.accounts.id.initialize({
      client_id: "264177546521-l4f6okrlas9sk890h9elaj17ce6ok5h7.apps.googleusercontent.com",
      callback: handleGoogleLogin
    });
    
    const btnContainer = document.getElementById("googleBtnContainer");
    if(btnContainer) {
        google.accounts.id.renderButton(
          btnContainer,
          { theme: "outline", size: "large", width: 400 }  
        );
    }
  });
</script>
